server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    port_in_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect root and /momo-store (no trailing slash) to SPA entry point
    location = / {
        return 301 /momo-store/;
    }

    location = /momo-store {
        return 301 /momo-store/;
    }

    # Serve the Vue SPA
    location /momo-store/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /momo-store/index.html;
    }

    # Proxy API calls to backend.
    # Static proxy_pass performs correct URI rewriting: /api/products -> /products.
    # After scaling (--scale backend=N), reload nginx to re-resolve DNS:
    #   docker compose exec frontend nginx -s reload
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
