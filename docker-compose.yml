name: momo-store

secrets:
  app_secret:
    file: ./secrets/app_secret.txt

services:
  backend:
    build:
      context: ./backend
    image: momo-store-backend:latest
    networks:
      - backend-net
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - app_secret
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.25'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    image: momo-store-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
        reservations:
          cpus: '0.10'
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/momo-store/"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - nginx-logs:/var/log/nginx

networks:
  # Public-facing network: only frontend is attached
  frontend-net:
    driver: bridge
  # Internal network: backend is not accessible from outside Docker
  backend-net:
    driver: bridge
    internal: true

volumes:
  nginx-logs:
    driver: local
